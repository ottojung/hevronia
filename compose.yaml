services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./backend/.data/qdrant:/qdrant/storage

  hevronia:
    build: .
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MY_OPENAI_API_KEY: ${MY_OPENAI_API_KEY}
